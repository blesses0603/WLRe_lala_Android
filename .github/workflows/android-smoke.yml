name: Android ARM64 phone build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - 'tools/**'
      - '.github/workflows/android-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - 'tools/**'
      - 'ANDROID/SECURITY.md'
      - 'ANDROID/SIGNING.md'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm64:
    name: Build ARM64 phone test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android source version consistency
        run: |
          python -c 'from pathlib import Path; from tools.android_release_version import source_version; source_version(Path("buildozer.spec"), Path("android_app/version.py"))'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libncurses5-dev libncursesw5-dev libltdl-dev zip unzip xvfb libmtdev1 libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install 'buildozer>=1.5,<2' 'cython<3' 'kivy==2.3.1' Pillow cryptography pyjnius==1.7.0
      - name: Run unit tests and check Python syntax
        env:
          KIVY_HOME: /tmp/wlre-kivy
          KIVY_NO_ARGS: '1'
          KIVY_NO_CONSOLELOG: '1'
        run: |
          xvfb-run -a python -m unittest discover -s tests -q
          python -m compileall -q main.py android_app wlre tools
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
      - name: Require pinned persistent signing for main APKs
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
        run: python tools/android_signing.py prepare
      - name: Mark PR builds as ephemeral and keep signing secrets isolated
        if: github.event_name == 'pull_request'
        env:
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '0'
        run: python tools/android_signing.py prepare
      - name: Verify ARM64 target
        run: grep -Fqx 'android.archs = arm64-v8a' buildozer.spec
      - name: Build ARM64 debug APK for phones
        run: |
          rm -rf .buildozer/android/app bin
          buildozer -v android debug
      - name: Prepare ARM64 phone APK with SHA256 checksum
        env:
          ANDROID_REQUIRE_PERSISTENT_SIGNING: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ github.event_name == 'pull_request' && '' || vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          mkdir -p phone-output
          apk_path="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "::error::ARM64 APK not found"; exit 1; }
          cp "$apk_path" phone-output/WLRe_LaLa-Android-arm64-debug.apk
          # Buildozer's Debug APK may use a distinct Gradle-generated certificate.
          # Always explicitly re-sign main APKs with the pinned persistent key.
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            python tools/android_signing.py resign phone-output/WLRe_LaLa-Android-arm64-debug.apk
          fi
          (cd phone-output && sha256sum WLRe_LaLa-Android-arm64-debug.apk > SHA256SUMS.txt)
          (cd phone-output && sha256sum --check SHA256SUMS.txt)
          python tools/android_presplash.py check-apk phone-output/WLRe_LaLa-Android-arm64-debug.apk
          python tools/android_signing.py report phone-output
          python tools/android_hardening.py report phone-output/WLRe_LaLa-Android-arm64-debug.apk
      - name: Upload ARM64 phone test APK and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'Android-arm64-pr-ephemeral-apk' || 'Android-arm64-apk' }}
          path: phone-output/*
          if-no-files-found: error
          retention-days: 7

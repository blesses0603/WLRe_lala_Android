name: Android Phase05 native-vault ARM64 experiment

# Opt-in single-branch experiment; no trusted signing secrets.
on:
  push:
    branches:
      - security/android-phase05-native-vault-pilot
    paths:
      - 'tools/android_native_vault.py'
      - 'tests/test_android_native_vault.py'
      - 'p4a-recipes/lalavault/**'
      - '.github/workflows/android-native-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase05-native-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vault:
    if: github.ref == 'refs/heads/security/android-phase05-native-vault-pilot'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      PYTHONUNBUFFERED: '1'
      PILOT_STAGE: /tmp/lalavault-phase05
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip \
            xvfb xauth libmtdev1 libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "Cython==3.0.12" \
            "kivy==2.3.1" Pillow cryptography pyjnius==1.7.0
      - name: Verify Python regression and safety preflight
        run: |
          xvfb-run -a python -m unittest discover -s tests -q
          python -m compileall -q main.py android_app wlre tools
          python tools/android_hardening.py preflight
          python tools/android_presplash.py check-spec
      - name: Host Cython vault behavior comparison
        run: python tools/android_native_vault.py host-smoke
      - name: Stage and NDK compile Phase04 wire plus Phase05 P0 vault
        run: |
          python tools/android_native_vault.py stage --source "$GITHUB_WORKSPACE" --output "$PILOT_STAGE"
          cd "$PILOT_STAGE"
          buildozer -v android debug
      - name: Audit both native cores and APK security
        run: |
          mapfile -t apks < <(find "$PILOT_STAGE/bin" -maxdepth 1 -name '*.apk' -type f | sort)
          test "${#apks[@]}" -eq 1
          hostpy="$PILOT_STAGE/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3.14"
          test -x "$hostpy"
          "$hostpy" -I -c 'import sys; assert sys.version_info[:2] == (3, 14)'
          mkdir -p phase05-proof
          cp "${apks[0]}" phase05-proof/
          apk="phase05-proof/$(basename "${apks[0]}")"
          python tools/android_native_wire.py report-apk "$apk" --pyc-python "$hostpy"
          python tools/android_native_vault.py report-apk "$apk" --pyc-python "$hostpy"
          python tools/android_presplash.py check-apk "$apk"
          python tools/android_hardening.py report "$apk"
          (cd phase05-proof && sha256sum *.apk > SHA256SUMS.txt)
          cat > phase05-proof/README_EXPERIMENT.txt <<'NOTE'
          Phase05 native vault pilot with original native wire; not pinned signed.
          This APK cannot upgrade the existing fixed-signed production app.
          Android Keystore JNI and persistent account migration still require real
          Android 12+ ARM64 device testing before formal release integration.
          NOTE
      - name: Upload experimental ARM64 APK proof
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Phase05-ARM64-NativeVault-EXPERIMENT-NOT-RELEASE
          path: phase05-proof/*
          if-no-files-found: error
          retention-days: 7

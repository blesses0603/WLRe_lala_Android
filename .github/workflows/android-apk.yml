name: Android phone APK (version tag)

# Phone APK builds only on version tags or an explicit manual dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tag and resolve Android version
        id: release
        run: |
          python tools/android_release_version.py
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tag must point to a commit on main."
              exit 1
            }
          fi
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip \
            xvfb libmtdev1 libgl1-mesa-dri
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "cython<3" "kivy==2.3.1" Pillow cryptography pyjnius==1.7.0
      - name: Test Android isolation, IPC, encrypted storage and UI
        run: xvfb-run -a python -m unittest discover -s tests -q
      - name: Check Python syntax and native startup-screen configuration
        run: |
          python -m compileall -q main.py android_app wlre tools
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.buildozer/android
            .buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wlre-arm64-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-wlre-arm64-
      - name: Require persistent Android signing for version-tag APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
        run: python tools/android_signing.py prepare
      - name: Build Android debug APK
        run: |
          rm -rf .buildozer/android/app bin
          buildozer -v android debug
      - name: Name APK and generate checksum
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p android-output
          apk_path="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "::error::APK not found"; exit 1; }
          output="WLRe_LaLa-Android-${RELEASE_VERSION}-debug.apk"
          cp "$apk_path" "android-output/$output"
          python tools/android_presplash.py check-apk "android-output/$output"
          cd android-output
          sha256sum "$output" > SHA256SUMS.txt
          cd ..
          ANDROID_REQUIRE_PERSISTENT_SIGNING=1 python tools/android_signing.py report android-output
          python tools/android_hardening.py report "android-output/$output"
      - name: Upload APK (only after successful build)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WLRe_LaLa-Android-${{ steps.release.outputs.version }}-debug
          path: android-output/*
          if-no-files-found: error
          retention-days: 14

name: Android v0.0.6 Test APK

on:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip \
            xvfb libmtdev1 libgl1-mesa-dri
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "cython<3" "kivy==2.3.1" Pillow cryptography pyjnius==1.7.0
      - name: Test Android isolation, IPC, encrypted storage and UI
        run: xvfb-run -a python -m unittest discover -s tests -q
      - name: Check Python syntax before packaging
        run: python -m compileall -q main.py android_app wlre
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.buildozer/android
            .buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wlre-arm64-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-wlre-arm64-
      - name: Build Android debug APK
        run: |
          rm -rf .buildozer/android/app bin
          buildozer -v android debug
      - name: Name APK and generate checksum
        run: |
          mkdir -p android-output
          cp "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" android-output/WLRe_LaLa-Android-v0.0.6-debug.apk
          cd android-output
          sha256sum WLRe_LaLa-Android-v0.0.6-debug.apk > SHA256SUMS.txt
      - name: Upload APK (only after successful build)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WLRe_LaLa-Android-v0.0.6-debug
          path: android-output/*
          if-no-files-found: error
          retention-days: 14

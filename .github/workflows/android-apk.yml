name: Android ARM64 native phone APK (pinned signing)

# Phone APK builds only on version tags or an explicit manual dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # workflow_dispatch supports selecting any branch in the GitHub UI.
    # Restrict trusted APK signing to manual main or validated version tags.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      PYTHONUNBUFFERED: '1'
      NATIVE_STAGE: /tmp/wlre-android-native-release
      # p4a detects ccache directly on PATH and supplies it to NDK Clang.
      # The compiler binary and flags remain part of ccache's content key.
      CCACHE_DIR: /home/runner/.cache/lala-android-ccache
      CCACHE_MAXSIZE: 850M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: /tmp/wlre-android-native-release
      USE_CCACHE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          # Cache downloaded wheels, not installed packages or credentials.
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified desktop SQLite resource seed
        run: python tools/android_resource_seed.py
      - name: Validate tag and resolve Android version
        id: release
        run: |
          python tools/android_release_version.py
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tag must point to a commit on main."
              exit 1
            }
          fi
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev gettext autopoint \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip ccache \
            xvfb xauth libmtdev1 libgl1-mesa-dri
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "Cython==3.0.12" "kivy==2.3.1" Pillow cryptography pyjnius==1.7.0 "UnityPy==1.25.4"
      # Cache only non-secret downloads in Buildozer's *global* SDK/NDK
      # directory and Gradle dependency caches. P4A compiled output, staged
      # project files, debug keystores and signed APKs must never be cached.
      - name: Compute platform dependency cache fingerprint
        id: build_cache_key
        run: python tools/android_build_cache.py
      - name: Restore Android SDK, NDK and Gradle dependency cache
        id: android_dependency_cache
        uses: actions/cache/restore@v4
        # Cache service outages must not block the original clean build.
        continue-on-error: true
        with:
          key: lala-android-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.key }}
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r28c
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
      # P1: compiler output cache; run-specific immutable keys allow each
      # successful build to contribute additional objects for the next run.
      # ccache validates compiler contents, source and invocation flags.
      - name: Restore vetted NDK compiler ccache
        id: native_ccache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: lala-ndk-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lala-ndk-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.key }}-
          path: ${{ env.CCACHE_DIR }}
      - name: Confirm ccache is available
        run: |
          command -v ccache
          ccache --version
          ccache --max-size=850M
          ccache --zero-stats
      - name: Test Android isolation, IPC, encrypted storage and UI
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Check Python syntax and native startup-screen configuration
        run: |
          python -m compileall -q main.py android_app wlre tools
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
      - name: Stage all eight P0/P1 ARM64 native cores before accessing signing secrets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python tools/android_native_cores.py stage --source "$GITHUB_WORKSPACE" --output "$NATIVE_STAGE"
          python -c 'import os; from pathlib import Path; from tools.android_hardening import check_configuration; from tools.android_release_version import source_version; stage = Path(os.environ["NATIVE_STAGE"]); check_configuration(stage); assert source_version(stage / "buildozer.spec", stage / "android_app/version.py") == os.environ["RELEASE_VERSION"], "Staged Android version differs from source release version"'
      # P2: only ten pinned third-party recipe roots and their source
      # downloads. NEVER restore .buildozer dists, python-installs,
      # bootstrap_builds or any of the eight LaLa native recipes.
      # ImageVersion and local recipe definitions invalidate the cache.
      - name: Restore pinned third-party p4a recipe builds
        id: p4a_thirdparty_restore
        if: steps.build_cache_key.outputs.native_enabled == 'true'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: lala-p4a-thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.native_key }}
          path: |
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/freetype
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/jpeg
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libffi
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libwebp
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/openssl
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/png
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/sqlite3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3-liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/freetype
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/hostpython3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/jpeg
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/libffi
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/libwebp
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/openssl
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/png
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/sqlite3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/python3
      - name: Pin public signer into Phase07 runtime Java guard (no private key)
        env:
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          python tools/android_integrity.py prepare-stage "$NATIVE_STAGE"
          python tools/android_integrity.py verify-stage "$NATIVE_STAGE"
      - name: Require persistent Android signing for version-tag APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: python tools/android_signing.py prepare
      - name: Build Android ARM64 APK with all P0/P1 Cython core recipes
        run: |
          cd "$NATIVE_STAGE"
          buildozer -v android debug
      - name: Display compiler cache statistics
        run: ccache --show-stats
      - name: Name APK and generate checksum
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          mkdir -p android-output
          mapfile -t apk_paths < <(find "$NATIVE_STAGE/bin" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ ${#apk_paths[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one native ARM64 APK; found ${#apk_paths[@]}"
            exit 1
          fi
          output="WLRe_LaLa-Android-${RELEASE_VERSION}-debug.apk"
          cp "${apk_paths[0]}" "android-output/$output"
          python tools/android_signing.py resign "android-output/$output"
          hostpython="$NATIVE_STAGE/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3.14"
          test -x "$hostpython" || { echo "::error::Pinned p4a hostpython3.14 missing"; exit 1; }
          "$hostpython" -I -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          # Fail closed: preserve Phase04 wire, require vault AND all six
          # remaining P0/P1 ARM64 extensions, shims, and zero implementation leaks.
          python tools/android_native_wire.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_native_vault.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_native_cores.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_seed_apk_audit.py "android-output/$output"
          python tools/android_presplash.py check-apk "android-output/$output"
          python tools/android_signing.py report android-output
          python tools/android_integrity.py report "$NATIVE_STAGE" android-output
          python tools/android_hardening.py report "android-output/$output"
          (cd android-output && sha256sum "$output" > SHA256SUMS.txt)
          # Phase09 publication gate: validate actual APK package/version/API,
          # all seven signed/native/security audit reports and their checksums.
          # Never add signing material to release evidence or upload on failure.
          python tools/android_release_gate.py android-output \
            --version "$RELEASE_VERSION" \
            --source-root "$NATIVE_STAGE" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" \
            --signer "$ANDROID_EXPECTED_SIGNER_SHA256"
      # Save only AFTER the complete signed APK and native/security gates pass.
      # A cache miss is not a failed build: the original clean install path
      # remains available; no partial/failed native outputs are published.
      - name: Cache checked non-secret Android build dependencies
        if: steps.android_dependency_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        # Successful signed APKs must remain publishable if cache upload fails.
        continue-on-error: true
        with:
          key: ${{ steps.android_dependency_cache.outputs.cache-primary-key }}
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r28c
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
      # Both caches save only after real APK audits and signature checks.
      # Missing/unavailable caches must not prevent uploading a valid APK.
      - name: Save vetted NDK compiler ccache
        if: steps.native_ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: lala-ndk-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CCACHE_DIR }}
      - name: Save checked third-party p4a recipe builds
        if: steps.build_cache_key.outputs.native_enabled == 'true' && steps.p4a_thirdparty_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: lala-p4a-thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache_key.outputs.native_key }}
          path: |
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/freetype
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/jpeg
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libffi
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libwebp
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/openssl
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/png
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/sqlite3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3-liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/freetype
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/hostpython3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/jpeg
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/libffi
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/liblzma
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/libwebp
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/openssl
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/png
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/sqlite3
            ${{ env.NATIVE_STAGE }}/.buildozer/android/platform/build-arm64-v8a/packages/python3
      - name: Upload APK (only after successful build)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WLRe_LaLa-Android-${{ steps.release.outputs.version }}-debug
          path: android-output/*
          if-no-files-found: error
          retention-days: 14


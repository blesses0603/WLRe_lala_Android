name: Android emulator startup smoke
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - 'tools/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android source version consistency
        run: |
          python -c 'from pathlib import Path; from tools.android_release_version import source_version; source_version(Path("buildozer.spec"), Path("android_app/version.py"))'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libncurses5-dev libncursesw5-dev libltdl-dev zip unzip xvfb libmtdev1 libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install 'buildozer>=1.5,<2' 'cython<3' 'kivy==2.3.1' Pillow cryptography pyjnius==1.7.0
      - name: Run unit tests and check Python syntax
        env:
          KIVY_HOME: /tmp/wlre-kivy
          KIVY_NO_ARGS: '1'
          KIVY_NO_CONSOLELOG: '1'
        run: |
          xvfb-run -a python -m unittest discover -s tests -q
          python -m compileall -q main.py android_app wlre tools
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.buildozer/android
            .buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wlre-x86-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-wlre-x86-
      - name: Restore persistent debug signing key when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python tools/android_signing.py prepare
      - name: Build emulator APK (not the arm64 phone download)
        run: |
          rm -rf .buildozer/android/app bin
          sed -i 's/android.archs = arm64-v8a/android.archs = x86_64/' buildozer.spec
          buildozer -v android debug
      - name: Prepare emulator APK with SHA256 checksum
        run: |
          mkdir -p emulator-output
          apk_path="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "::error::Emulator APK not found"; exit 1; }
          cp "$apk_path" emulator-output/WLRe_LaLa-Android-emulator-debug.apk
          (cd emulator-output && sha256sum WLRe_LaLa-Android-emulator-debug.apk > SHA256SUMS.txt)
          python tools/android_signing.py report emulator-output
      - name: Upload emulator APK and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-emulator-apk
          path: emulator-output/*
          if-no-files-found: error
          retention-days: 7
  arm64:
    name: Build ARM64 phone test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android source version consistency
        run: |
          python -c 'from pathlib import Path; from tools.android_release_version import source_version; source_version(Path("buildozer.spec"), Path("android_app/version.py"))'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libncurses5-dev libncursesw5-dev libltdl-dev zip unzip xvfb libmtdev1 libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install 'buildozer>=1.5,<2' 'cython<3' 'kivy==2.3.1' Pillow cryptography pyjnius==1.7.0
      - name: Run unit tests and check Python syntax
        env:
          KIVY_HOME: /tmp/wlre-kivy
          KIVY_NO_ARGS: '1'
          KIVY_NO_CONSOLELOG: '1'
        run: |
          xvfb-run -a python -m unittest discover -s tests -q
          python -m compileall -q main.py android_app wlre tools
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.buildozer/android
            .buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wlre-arm64-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-wlre-arm64-
      - name: Restore persistent debug signing key when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python tools/android_signing.py prepare
      - name: Verify ARM64 target
        run: grep -Fqx 'android.archs = arm64-v8a' buildozer.spec
      - name: Build ARM64 debug APK for phones
        run: |
          rm -rf .buildozer/android/app bin
          buildozer -v android debug
      - name: Prepare ARM64 phone APK with SHA256 checksum
        run: |
          mkdir -p phone-output
          apk_path="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "::error::Emulator APK not found"; exit 1; }
          cp "$apk_path" phone-output/WLRe_LaLa-Android-arm64-debug.apk
          (cd phone-output && sha256sum WLRe_LaLa-Android-arm64-debug.apk > SHA256SUMS.txt)
          (cd phone-output && sha256sum --check SHA256SUMS.txt)
          python tools/android_signing.py report phone-output
      - name: Upload ARM64 phone test APK and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-arm64-apk
          path: phone-output/*
          if-no-files-found: error
          retention-days: 7
  smoke:
    needs: build
    name: Android API ${{ matrix.api }} startup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: [31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Android-emulator-apk
          path: bin
      - name: Verify emulator APK checksum
        run: (cd bin && sha256sum --check SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android and verify UI and foreground service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python tools/android_smoke.py
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-API-${{ matrix.api }}-startup-diagnostics
          path: android-smoke-*.txt
          if-no-files-found: ignore

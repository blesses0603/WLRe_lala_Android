name: Android fast checks (no APK)

# Keep routine PR/main runs inexpensive. Full ARM64 APK builds are exclusively
# manual or version-tagged in android-apk.yml, where persistent signing is pinned.
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - 'tools/**'
      - '.github/workflows/android-smoke.yml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'buildozer.spec'
      - 'tools/**'
      - 'ANDROID/SECURITY.md'
      - 'ANDROID/SIGNING.md'
      - 'ANDROID/README.md'
      - '.github/workflows/android-smoke.yml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python regression and security preflight (no APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install lightweight test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libmtdev1 libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install 'cython<3' -r requirements-dev.txt
      - name: Validate Android source, config and safety
        run: |
          python -c 'from pathlib import Path; from tools.android_release_version import source_version; source_version(Path("buildozer.spec"), Path("android_app/version.py"))'
          python -m compileall -q main.py android_app wlre tools
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
          grep -Fqx 'android.archs = arm64-v8a' buildozer.spec
      - name: Run Python regression and workflow policy tests
        run: xvfb-run -a python -m unittest discover -s tests -q

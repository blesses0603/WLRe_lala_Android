name: Android ARM64 native phone APK (pinned signing)

# Phone APK builds only on version tags or an explicit manual dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # workflow_dispatch supports selecting any branch in the GitHub UI.
    # Restrict trusted APK signing to manual main or validated version tags.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KIVY_HOME: /tmp/wlre-kivy
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      PYTHONUNBUFFERED: '1'
      NATIVE_STAGE: /tmp/wlre-android-native-release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tag and resolve Android version
        id: release
        run: |
          python tools/android_release_version.py
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tag must point to a commit on main."
              exit 1
            }
          fi
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip \
            xvfb xauth libmtdev1 libgl1-mesa-dri
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "Cython==3.0.12" "kivy==2.3.1" Pillow cryptography pyjnius==1.7.0
      - name: Test Android isolation, IPC, encrypted storage and UI
        run: xvfb-run -a python -m unittest discover -s tests -q
      - name: Check Python syntax and native startup-screen configuration
        run: |
          python -m compileall -q main.py android_app wlre tools
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
      - name: Stage all eight P0/P1 ARM64 native cores before accessing signing secrets
        run: |
          python tools/android_native_cores.py stage --source "$GITHUB_WORKSPACE" --output "$NATIVE_STAGE"
          python -c 'import os; from pathlib import Path; from tools.android_hardening import check_configuration; from tools.android_release_version import source_version; stage = Path(os.environ["NATIVE_STAGE"]); check_configuration(stage); assert source_version(stage / "buildozer.spec", stage / "android_app/version.py") == "v0.0.8"'
      - name: Pin public signer into Phase07 runtime Java guard (no private key)
        env:
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          python tools/android_integrity.py prepare-stage "$NATIVE_STAGE"
          python tools/android_integrity.py verify-stage "$NATIVE_STAGE"
      - name: Require persistent Android signing for version-tag APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: python tools/android_signing.py prepare
      - name: Build Android ARM64 APK with all P0/P1 Cython core recipes
        run: |
          cd "$NATIVE_STAGE"
          buildozer -v android debug
      - name: Name APK and generate checksum
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ANDROID_REQUIRE_PERSISTENT_SIGNING: '1'
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          mkdir -p android-output
          mapfile -t apk_paths < <(find "$NATIVE_STAGE/bin" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ ${#apk_paths[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one native ARM64 APK; found ${#apk_paths[@]}"
            exit 1
          fi
          output="WLRe_LaLa-Android-${RELEASE_VERSION}-debug.apk"
          cp "${apk_paths[0]}" "android-output/$output"
          python tools/android_signing.py resign "android-output/$output"
          hostpython="$NATIVE_STAGE/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3.14"
          test -x "$hostpython" || { echo "::error::Pinned p4a hostpython3.14 missing"; exit 1; }
          "$hostpython" -I -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          # Fail closed: preserve Phase04 wire, require vault AND all six
          # remaining P0/P1 ARM64 extensions, shims, and zero implementation leaks.
          python tools/android_native_wire.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_native_vault.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_native_cores.py report-apk "android-output/$output" --pyc-python "$hostpython"
          python tools/android_presplash.py check-apk "android-output/$output"
          python tools/android_signing.py report android-output
          python tools/android_integrity.py report "$NATIVE_STAGE" android-output
          python tools/android_hardening.py report "android-output/$output"
          (cd android-output && sha256sum "$output" > SHA256SUMS.txt)
      - name: Upload APK (only after successful build)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WLRe_LaLa-Android-${{ steps.release.outputs.version }}-debug
          path: android-output/*
          if-no-files-found: error
          retention-days: 14

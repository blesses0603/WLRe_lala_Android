name: LaLa Android PR diagnostics (no APK)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-pr-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static-check dependencies
        run: python -m pip install 'Pillow>=10,<12' 'cryptography>=42,<47'
      - name: Restore verified resource seed
        run: python tools/android_resource_seed.py
      - name: Static validation (no APK or signing)
        run: |
          python -m compileall -q main.py android_app wlre tools
          python tools/android_parity_audit.py
          python tools/android_presplash.py check-spec
          python tools/android_hardening.py preflight
      - name: Explain scope
        run: echo 'Static checks only. Full Android smoke and APK builds are separate workflows.' >> "$GITHUB_STEP_SUMMARY"

name: Android emulator startup smoke
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'wlre/**'
      - 'buildozer.spec'
      - 'tools/android_smoke.py'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      KIVY_NO_ARGS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libncurses5-dev libncursesw5-dev libltdl-dev zip unzip
          python -m pip install 'buildozer>=1.5,<2' 'cython<3'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.buildozer/android
            .buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wlre-x86-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-wlre-x86-
      - name: Build emulator APK (not the arm64 phone download)
        run: |
          rm -rf .buildozer/android/app bin
          sed -i 's/android.archs = arm64-v8a/android.archs = x86_64/' buildozer.spec
          buildozer -v android debug
      - name: Upload emulator APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-emulator-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
  smoke:
    needs: build
    name: Android API ${{ matrix.api }} startup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: [31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Android-emulator-apk
          path: bin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android and verify UI and foreground service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python tools/android_smoke.py
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-API-${{ matrix.api }}-startup-diagnostics
          path: android-smoke-*.txt
          if-no-files-found: ignore
